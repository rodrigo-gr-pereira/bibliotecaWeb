<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Biblioteca Web</title>
  <link rel="stylesheet" href="./login.css">
</head>

<body>
  <div class="login-container">
    <div class="login-card">
      <h2>Biblioteca Web</h2>
      <p class="subtitle">Faça login para acessar o sistema</p>

      <form id="login-form">
        <div class="input-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" required placeholder="seu.email@exemplo.com">
        </div>

        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" required placeholder="********">
        </div>

        <div class="form-actions">
          <a href="#" id="forgot-password">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn-primary">Entrar</button>
      </form>
    </div>
  </div>

  <script type="module" src="./login.js"></script>
</body>

</html>
